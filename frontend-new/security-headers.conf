# Bezpečnostné hlavičky pre všetky odpovede.
#
# POZOR na nginx pascu: add_header sa dedí z vyššej úrovne LEN do location,
# ktorá nemá žiadny vlastný add_header. Preto sú hlavičky v tomto súbore a
# includuje ho server blok aj každá location s vlastným add_header
# (dnes /assets/). Pri novej location s add_header sem pridaj include.
# `always` = aj na chybových odpovediach (404, 413, 502).

# Appka sa nedá vložiť do iframe (clickjacking na admin akcie).
# frame-ancestors v CSP je moderná podoba, X-Frame-Options pre staršie prehliadače.
add_header X-Frame-Options "DENY" always;

# Prehliadač nesmie hádať typ súboru (napr. nahraté „PDF" spustiť ako HTML/JS).
add_header X-Content-Type-Options "nosniff" always;

# Adresa stránky sa neposiela ďalej (Google Fonts, odkazy von).
add_header Referrer-Policy "no-referrer" always;

# Appka nepotrebuje kameru, mikrofón ani polohu.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy:
#   script-src 'self'    — žiadne inline ani cudzie skripty; XSS nespustí vložený kód
#   style-src  'unsafe-inline' — Radix (Dialog, Select) vkladá <style> pri
#                          zamykaní scrollu; bez neho sa rozbijú modály.
#                          Štýly nespúšťajú kód, riziko je malé.
#   fonts.googleapis.com / fonts.gstatic.com — písmo Inter z index.html
#   connect-src 'self'   — API je na tej istej doméne (/api cez tento nginx)
#   frame-ancestors 'none' — nikto nás nevloží do iframe
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
