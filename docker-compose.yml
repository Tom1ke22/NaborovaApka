services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    # --proxy-headers + --forwarded-allow-ips: uvicorn prepíše request.client.host
    # na skutočnú IP klienta z X-Forwarded-For, ale len ak request prišiel od
    # proxy v zozname. Bez toho sa rate limit kľúčuje na IP proxy a platí
    # spoločne pre všetkých uchádzačov.
    # Lokálne v Dockeri chodia requesty z privátnej siete compose, preto *.
    # V produkcii sem patrí konkrétna adresa reverznej proxy.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*

  frontend:
    build: ./frontend-new
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
